<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Register – ocr-processor</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Create an Account</h1>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" th:field="*{username}" autocomplete="username"/>
            <span class="field-error" th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"></span>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email"/>
            <span class="field-error" th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" th:field="*{password}" autocomplete="new-password"/>
            <span class="field-error" th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"></span>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password"/>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
