<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Change Password – ocr-processor</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>
<div class="container">
    <h1>Change Password</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/profile/change-password}" th:object="${changePasswordRequest}" method="post" class="auth-card">
        <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input id="currentPassword" type="password" th:field="*{currentPassword}" autocomplete="current-password"/>
            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}"
                  th:errors="*{currentPassword}"></span>
        </div>
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" th:field="*{newPassword}" autocomplete="new-password"/>
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                  th:errors="*{newPassword}"></span>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password"/>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}"></span>
        </div>
        <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
    <p><a th:href="@{/home}">← Back to Home</a></p>
</div>
</body>
</html>
