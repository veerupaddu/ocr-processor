spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ocrprocessor}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:${LLM_API_KEY:dummy-key-for-dev}}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${LLM_API_KEY:dummy-key-for-dev}}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
    expiry-hours: 8
  ocr:
    max-file-size-bytes: 20971520
    tessdata-path: ${TESSDATA_PREFIX:}
    language: eng
    allowed-types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/tiff
  llm:
    max-input-chars: 10000
    prompt-template: "Summarise the following document text in 3-5 sentences. Be concise and factual.\n\n{extractedText}"
  security:
    max-login-attempts: 5
    lockout-duration-minutes: 15

logging:
  level:
    ai.medhaleak: DEBUG
    org.springframework.security: INFO
