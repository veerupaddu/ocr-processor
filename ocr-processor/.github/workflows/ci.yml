name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ─── Unit + Integration Tests (Java) ────────────────────────────────────────
  java-tests:
    name: Java Tests (Unit + Integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng imagemagick

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run Maven tests
        run: mvn test -Dspring.profiles.active=test
        env:
          LLM_API_KEY: test-key
          JWT_SECRET: test-secret-key-that-is-long-enough-32chars!

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: target/surefire-reports/

  # ─── E2E Tests (Python / pytest) ────────────────────────────────────────────
  python-e2e-tests:
    name: Python E2E Tests
    runs-on: ubuntu-latest
    needs: java-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ocrprocessor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract and ImageMagick
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng imagemagick

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Start application
        run: |
          java -jar target/ocr-processor-*.jar \
            --spring.profiles.active=test \
            --server.port=8080 > app.log 2>&1 &
          echo $! > app.pid
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ocrprocessor
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          LLM_API_KEY: test-key
          JWT_SECRET: test-secret-key-that-is-long-enough-32chars!

      - name: Wait for app to be ready
        run: |
          READY=false
          for i in $(seq 1 30); do
            if curl -s -f -o /dev/null http://localhost:8080/login; then
              READY=true
              echo "Application is ready!"
              break
            fi
            echo "Waiting for app to be ready... ($i/30)"
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "Application failed to start within timeout. Application log:"
            cat app.log || true
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Run E2E tests
        run: pytest tests/e2e/ --base-url=http://localhost:8080 -v --tb=short

      - name: Run Regression tests
        run: pytest tests/regression/ --base-url=http://localhost:8080 -v --tb=short

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

      - name: Upload Application Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-log
          path: app.log

      - name: Upload Python test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-reports
          path: tests/
